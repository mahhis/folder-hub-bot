# Reviewed bootstrap drop-in; never installed automatically by an artifact.
[Service]
WorkingDirectory=/opt/folder-hub-bot/current
ExecStart=
ExecStart=/usr/bin/node /opt/folder-hub-bot/current/dist/app.js
Environment=BOT_LIFECYCLE_SOCKET=/run/folder-hub-bot/lifecycle.sock
Environment=BOT_RELEASE_FILE=/opt/folder-hub-bot/current/RELEASE_SHA
RuntimeDirectory=folder-hub-bot
RuntimeDirectoryMode=0700
TimeoutStopSec=150
SendSIGKILL=no
